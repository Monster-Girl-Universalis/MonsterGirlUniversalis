l_english:
#Branch 1
SLUG_slug_tower_title: "Slug Tower"
SLUG_slug_tower_desc: "Slug Tower represents the beating heart of slugkind and the nation around it the most powerful of all slug states, making the Sluggy Star sisters acknowled us as the protectors of slugs will be a crucial step towards our ambitions."
SLUG_iliasburg_title: "Iliasburg Conquest"
SLUG_iliasburg_desc: "Iliasburg stands as the largest city on the continent, seizing its wealth for ourselves will greatly advance our goals of dominating continental Ilias"
SLUG_irina_enrika_title: "Road to our Sisters"
SLUG_irina_enrika_desc: "Our advance into the lands of the earthworm girls has put the region of of the lost woods and Iliasville into our sights, critically we are also close to our southern brethrens led by Elisabeth's younger sister Melk, whatever success our sisters may have achieve of their own they must be brought under our rule!"
#Branch 2
SLUG_capital_title: "Gastropod Capital"
SLUG_capital_desc: "The capital city is the very heart of any nation, we must concentrate our efforts into building a strong capital from which we shall one day rule a mighty empire!"
SLUG_reform_title: "Administrative Reform"
SLUG_reform_desc: "Land dweller administration isn't very effective compared to other monsters, but as our nation expands our shortcomings become more noticeable, devoting our attention to an administrative reform to bring the efficency of our goverment to the same level as the rest of monsterkind is a priority."
SLUG_high_slugs_title: "High Slugs"
SLUG_high_slugs_desc: "High Slugs are those slugs that wield a rapier rather than a sword as their main weapon, but they do so with the most excelence and elegance. Elisabeth is the most skillful out of them all, and as such bringing her bow down before us will give much more legitimacy to our claim of dominion over slugkid."
SLUG_harpy_tower_title: "Skewer the Harpy"
SLUG_harpy_tower_desc: "The harpies led by queen Lucretia are rumored to have fallen ill to some desease forcing them to isolate themselves in a tower, with the harpies numbers still recovering from the scars left by the former queen harpy Ratflesia's wars this is the ideal time to strike them and expand our domain."
SLUG_pornof_title: "Discipline Pornof"
SLUG_pornof_desc: "Pornof the capital of degenerancy and gambling stands before us, it is about time someone reins in these degenerates."
SLUG_iliasville_title: "To the Holy Temple"
SLUG_iliasville_desc: "The region of Iliasville is the home of the sacred Ilias Temple, once the place where the goddess of light would descend from heaven to bless heroes, it nevertheless remains a strategic location for its new role with jobs and race advances."
#Branch 3
SLUG_raise_army_title: "Attack of the Slugs!"
SLUG_raise_army_desc: " All over the world slugs are ridicule as low level monsters at best and a infestation at worse, we can't let such slander stain our name, we shall change their minds with our blades!"
SLUG_flexing_title: "Might makes Right"
SLUG_flexing_desc: "The wretched village of Midas is oppressing our sisters but taking on them right now is out of the question, instead we should wrestle into submission nearby countries to show off the power of slugs to those gold digging beasts!"
SLUG_midas_title: "End Midas' Oppression"
SLUG_midas_desc: "We emerged victorious and stripped the humans of most of their gold, what's left of their nation is now an easy picking for us, this day shall always be remembered in the annals of history! With this victory none can contest our right to claim dominion over all of slugkind!"
#Branch 4
SLUG_ideas_title: "Land Dweller Pride"
SLUG_ideas_desc: "We must take pride in our land dweller flesh, as devote ourselves to pass down the ways of our kin."
SLUG_yoma_title: "Unnatural Selection"
SLUG_yoma_desc: "We have mastered our race skills, but to reach our true potential we must become Yoma monsters, as their abilities pair very well with our own, we shall select the strongest our of soldiers and have them undergo experimentation to change their race to yoma."
SLUG_rosary_title: "Slug Nuns"
SLUG_rosary_desc: "The slug nuns are followers of the goddess of light Ilias despite being monsters, yet they are still connected to us by blood and any future would be slug empire would be incomplete without them, we should use this opportunity to settle the religious problems ailing our country."
#Branch 5
SLUG_midas_slugs_title: "Midas Slug"
SLUG_midas_slugs_desc: "Slugs make a very large chunk of the Midas Village population, yet they are called pests by the villagers! The liberation of our kin from such oppression must become the primary goal of all slugs everywhere!"
SLUG_midas_village_title: "Wealth of Midas"
SLUG_midas_village_desc: "The Midas region is filled with the largests deposits of gold in the world, conquering these region will ensure a boost to our economy capable of fielding the largest army on the continent!"
