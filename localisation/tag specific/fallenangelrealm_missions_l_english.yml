#Events
flavor_far.1_title: "A Leader Arises"
flavor_far.1_desc: "For years the angels who were cast down on earth from heaven found refugee in the pacifist village of Enrika under the guidance of Micaela, living a modest life working on fields alongside the other monsters who found in Enrika a home as well. But it seems like the quiet is not for everyone, a among our kind a fallen angel has rose to prominance, claiming that the eons passed under the rule of the goddess of light has deprived them of the joys of life and that the safety of Enrika has done nothing but become their protective shell. She's rallying around angels calling for a divorce from the village so that we may stand on our own legs and explore the outside world and experience all that was prohibited to us."
flavor_far.2_title: "War is Upon Enrika!"
flavor_far.2_desc: "The village is in chaos, elves franatically prepare their bows, fairies go in hinding, our soldiers take positions to fight their former neighbours..."
flavor_far.3_title: "Ilias Temple Jobs"
flavor_far.3_desc: "Ilias Tample once the place where the goddess herself would ascend from heaven to baptized heroes, now stands as a structure mainly used for changing jobs. Indeed now that were are here we might as well change our jobs to try something different, but what should we choose?"
#Event Choices
flavor_far.1.a: "I want to see the world!"
flavor_far.2.a: "There's no turning back now!"
flavor_far.3.a: "Magic is nice but Machinas have their own charm and style!"
flavor_far.3.b: "Some pleasure related job might be fun to try..."
flavor_far.3.c: "Something that works well with our angelic race."
#Reform names
Fallen_angel_state: "Fallen Angel Realm"
Fallen_angel_state_desc: "A realm inhabited by both the fallen angels who were casted down from Heaven and the angel who remained stuck on earth after the great disaster, with a heavy focus on warfare and farm work."
