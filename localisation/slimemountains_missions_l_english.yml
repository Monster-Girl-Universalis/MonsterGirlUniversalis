l_english:
#Branch 1
SLM_race_slime_title: "Testing our Jelly"
SLM_race_slime_desc: "The texture of our slimy bodies can do a lot of stuff, like recombining, repelling sword attacks and dividing our bodies, we should work a little sweat puru puru!"
SLM_dev_title: "Human Infrastructure"
SLM_dev_desc: "Humans are very good at building cool stuff like very tall, sturdy, cute and colorful buildings, we could build shops for our boomerangs and other stuff in our country if we ask them to teach us!"
SLM_trading_title: "Mastering Trade"
SLM_trading_desc: "Paying slime girls to fight big scary wars costs a lot of gold, we must make an effort to learn the secrets of trading and economics to expand our trading beyond just boomerangs and fish and we must make adjustments to our government to be more trade-friendly."
SLM_republic_title: "Form a Slime Republic"
SLM_republic_desc: "Ruling a country is too stressful a job for a single slime gal to bear, with what we've learned from the humans we can switch to a republic form of government that will relieve our leaders from boring lives of work while giving our citizen power to their voice and enjoy more money making freedoms!"
SLM_great_power_title: "Most Jiggly Republic"
SLM_great_power_desc: "We have become one of the richest countries in the world, surpassing even the monster lord's domain! with so much gold we will never have shortages of slime girls ready to defend our country puru puru!"
#Branch 2
SLM_humans_title: "Humans Join the Party!"
SLM_humans_desc: "We've taken over the human village of Iliasville, but we aren't bad slimes, so we'll welcome the humans to dance the boomerang shuffle!"
SLM_slugs_title: "The Big Meanies!"
SLM_slugs_desc: "Our country now shares a border with the bad slugs, they do nothing but eat veggies all day and mock us, it's time we settle who's the most slimey monster!"
SLM_bunni_title: "Slimy Pals!"
SLM_bunni_desc: "Our carrot-loving friend Bunni has joined our ranks, as fellow slimes we must celebrate by dacing in the rivers and throwing our boomerangs around! Two slime together can be better than having one big brain! Puru puru puru!"
#Branch 3
SLM_unification_title: "Nice and Slimy"
SLM_unification_desc: "Everyone calls us weak monsters, but we're not! are we will prove them wrong! but we need to all be together to do."
SLM_starting_blobbing_title: "Blobbing Around"
SLM_starting_blobbing_desc: "Humans and a lot of monsters around us are weak to our slime attacks, we should make use of our gelatinous body to expand!"
SLM_irina_road_title: "To the Big City!"
SLM_irina_road_desc: "Iliasburg is the largest city on the continent, we can expect lots of trade and gold coming and going from it, we must make our way there! Puru puru!"
SLM_iliasburg_title: "Iliasburg Tour!"
SLM_iliasburg_desc: "The big big city is ours! now we can share the joy of boomerans to everyone puru puru!"
SLM_midas_title: "Quest for Gold"
SLM_midas_desc: "With the majority of Iliasburg wrapped in our slime we can cleansed the waterways and allow for weaker slimes to prosper and multiply. Midas village and its gold mines are now on our sights ready to be slimed!"
SLM_big_blue_blob_title: "Big Blue Blob"
SLM_big_blue_blob_desc: "The whole continent is now a slimy paradise that welcomes every slime, with crystal clear waters everywhere, we have achieve something far beyond our greatest dreams!"
#Branch 4
SLM_mandragora_title: "Plant Girls Join the Party!"
SLM_mandragora_desc: "We have made friends with plant monsters called Mandragoras, we slime can also work the fields to grow veggies to sell, so having them help on the field would be nice puru puru!"
SLM_beast_title: "Beasts Join the Party!"
SLM_beast_desc: "We met lots of Orc and Bunny girls around the city of perverts, they're very nice people and some slimes have started to act like bunnies too!"
SLM_harpy_title: "Wet Birds"
SLM_harpy_desc: "Happiness village is an important trade hub in the continent, alongside being the largest producer of wind-element weapons and armor, we might make the harpies mad for attacking their humans friends, but they really hate when our sticky slimes gets on their wings, so it should be easy puru puru!"
#Branch 5
SLM_big_city_title: "A Nice city!"
SLM_big_city_desc: "We slimes don't have a proper city, but that's okay because we can build one big city just like the ones humans have!"
SLM_walls_title: "Protecting the Slime Lands"
SLM_walls_desc: "We have blobbed a bit in the past years, but our core states inhabited by the majority of us slimes are unprotected, those areas have the cleanest bodies of water in our nation and are very important for weak slimes that can't live in polluted waters. Now that we have saved up some money we should invest in defenses for our santuaries."
SLM_rich_slimes_title: "Prosperous Slime Paradise"
SLM_rich_slimes_desc: "We have concentrated our efforts into building our initial states into prosperous, well-protected core lands that are the envy of every continent! PuruPuruuuu!"
SLM_trade_ships_title: "Slime Trade Fleet"
SLM_trade_ships_desc: "Trading fleets are a very important part of a nation's economy, and now that we have blobbed far enough to touch the sea, it is about time we develop a slime fleet dedecated to commerce!"
