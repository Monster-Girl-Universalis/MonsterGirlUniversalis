#Event Insights
flavor_insight_rma.1: "§TThis mission will unlock the spiritualists estate after a day tick.§W"

#Events
flavor_rma.1_title: "Rostrum Region United"
flavor_rma.1_desc: "All of the region surrounding Rostrum Village is under our rule now and that raises the question of how are we going to call ourselves that we aren't relegated to the Rostrum Mountains."

flavor_rma.2_title: "Birth of a New City"
flavor_rma.2_desc: "Our efforts to rebuild Rostrum Village into something greater than what it is have payed off: the village, now a proper city has eclipsed many of the Ilian cities and has a newfound tradition and fame for its wax production. The best part is that all of its former inhabitants have contributed to this rebirth as ghosts! The city's newfound growth has led to some people in our court to suggest moving our capital here, while others prefer the more defensive capital we currently have."

flavor_rma.3_title: "Ardent Faith"
flavor_rma.3_desc: "Our exchange with the slimes race has proven to be a very wise choice, the versatility of our wax bodies has increased tenfold thanks to their teachings, but one of the more interesting side effects was developing a more fire-resistant body! Although our bodies are still weak to it our new ability to harden our wax has made contact with fire more manageable. In that regard, our merchants have mentioned encountering monsters that worship the fire spirit Salamander that resides in the faraway Gold Volcano. Perhaps we should consider devoting ourselves to the scorching faith now that we can play with fire a bit more safely?"

#Event choices

flavor_rma.1.a: "We'll keep our current name."
flavor_rma.1.b: "Rostrum is becoming more and more the center of our nation...we'll take their legacy."
flavor_rma.1.c: "We'll take on a name that reflects ourselves best."
flavor_rma.2.a: "Rostrum will be our new capital!"
flavor_rma.2.b: "The current capital is more easily defended."
flavor_rma.3.a: "I don't want to set the world on fire..."
flavor_rma.3.b: "Let's start a flame in our hearts!"

