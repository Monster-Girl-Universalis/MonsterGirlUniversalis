#Events
flavor_hr1.1_title: "Ranael's Proposal"
flavor_hr1.1_desc: "As the Goddess and Seraph Eden keep the barrier running, the task of guinding the other angels and expand Ilias' influence in the world has fallen on Heriel's shoulders. While Eden was nominally the ruler of Snow Heaven since the great disaster, it was actually the angel Ranael who ran the settlement as Eden was absent due to her efforts to maintain the barrier around the Ilias Temple Ruins. Now Ranael has come forward with a proposal; She will lend Heriel her help in running the country with her experience as former de-facto head of Snow Heaven."
flavor_hr1.2_title: "Chocolate Heaven"
flavor_hr1.2_desc: "One can say that all angels love sweets one way or the other, but even among angels Heriel is a chocolate connoisseur that stands out, and our ruler was very gay at the news that lots of chocolate sweets from Snow Heaven were finding their way into our nation, so much so that she requested an audience with several angel merchants selling the goods in our capital city, she enthusiastically proposed a deal to start cocoa farms right in our seat of power. though this move comes from a personal yerning from our ruler, it will undoubtedly gain us the favor of our angelic subjects."
flavor_hr1.3_title: "Unclaimed Islands found"
flavor_hr1.3_desc: "We have been controlling the island home to the Great Pirate Cave for a while now, it has become a naval hub where our merchant ships restook for long journeys far away or for our navy to patrol the waters around our homeland. Some reports have started arriving of sightings of two lonely islands one near Snow continent and the other by the Magistean coastline, they appear to be very isolated islets not found on any map, though they seem of little importance it is an easy land grab that shouldn't alarm our neighbours."
flavor_hr1.4_title: "Ranael's Wrath"
flavor_hr1.4_desc: "Archangel Ranael, one of the crueler angels out there and the one tasked with carrying out divine punishment onto sinners, is not very pleased with her current state of affairs. Since Heaven fell she has been overseeing Snow Heaven's constrution and administration in Eden's stead, but Heriel's rise to prominance has put her out of the picture, and while she did attempt to cling onto her former station by approching Heriel with a deal to co-rule the angel apoptosis' realm, she was soundly rejected, by someone who used to be a low ranking angel no less. That brings us to the present, an angry Ranael finds herself out in the freezing wilderness of the snowy continent unleashing her attacks on trees and mountains out of frustration...Such a sorry sight isn't becoming of the angel of divine punishment."
#Event Choices
flavor_hr1.1.a: "I will gladly take on big sister Ranael's offer!"
flavor_hr1.1.b: "The rule of angelkin was entrusted to me and me alone!"
flavor_hr1.2.a: "Chocolate is delicious...Ahh this is really Heaven..."
flavor_hr1.3.a: "I feel like an explorer!"
flavor_hr1.4.a: "Lend me your strenght, bring terror to our enemies once again!"