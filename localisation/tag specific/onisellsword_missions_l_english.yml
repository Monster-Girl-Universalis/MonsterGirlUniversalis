#Events
flavor_oss.1_title: "Mercenary Unrest"
flavor_oss.1_desc: "Various mercenaries from around the globe have been hired by Lucia to aid her in the Magistean civil war, although makinas for hire the majority of these legionnaires truly believe in Lucia's cause of containing the spread of tentacle magic. Allas unrest is growing within the ranks of the hired monsters as the status quo on the battlefield persists. Should this situation prolong itself or worsened, the mercenaries might take matters in their own hands."
flavor_oss.2_title: "Mercenaries Rallying to Us!"
flavor_oss.2_desc: "Trust in Lucia's capabilities of winning this war has reached an all-time low, with many mercenaries opting to form a separate fighting force to stop Lilly's ambitions on their own."
flavor_oss.3_title: "Nabisu and Naho's Aid!"
flavor_oss.3_desc: "Nabisu and Naho have joined our ranks alongside their fellow monsters to support the war effort, they have extended an offer to lead our armies as generals as well!"
flavor_oss.4_title: "Freedom!"
flavor_oss.4_desc: "The fog of war has lifted and the dust has settle, we celebrate our victory!"
#Event Choices
flavor_oss.1.a: "We must prepare for the worst."
flavor_oss.2.a: "Forgive us Lady Lucia, but we cannot allow Lily to win!"
flavor_oss.3.a: "The die is cast!"
flavor_oss.4.a: "We're out of a job though..."
