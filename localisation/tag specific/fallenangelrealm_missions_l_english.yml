l_english:
#Branch 1
FAR_water_title: "A Boat for our Crops"
FAR_water_desc: "We take great pride in the hard work we put in cultivating our crops and raising our cattle, but trading the fruits of our hard labour on land has its limits. Setting up a merchant fleet would allow us to export our products further away."
FAR_river_title: "A Proper Fleet"
FAR_river_desc: "Despite our lack of experience with naval affairs we have made some progress. We should invest more in order to make advanced and versatile fleet."
FAR_lake_title: "Fallen Angel Merchant Fleet"
FAR_lake_desc: "Our fleet has establish itself as the dominant one in the waters of our home region, ensuring the safely of our goods."
FAR_sea_title: "Shipbuilding Industry"
FAR_sea_desc: "Our prowess with woodcutting and newfound knowledge of shipbuilding has put us in a position where we can build a noteworthy ocean fleet and expand our influence beyond our borders."
FAR_polar_title: "Settle Polar Bear Island"
FAR_polar_desc: "We have received some unconfirmed reports of an unclaimed island west of Magistea village. If this is true, the island could become a great naval base to send out more expeditions to find the whereabouts of Heaven."
FAR_isolated_title: "Stairway to Heaven"
FAR_isolated_desc: "The expeditions that sailed from Polar Bear island have returned, and they report having found a large continent with high mountain ranges surrounding it. As this landmass doesn't appear in any map dating before the Great Disaster we can assume it is probably what remains of Heaven... Fortunately our sailors also report the discovery of another unclaimed island next to the new continent, that shall be our base from which we'll explore this land."
FAR_heaven_title: "Race Across the Angel Seas"
FAR_heaven_desc: "After such a long journey we have finally reached the coast of this frozen land... Although it seems the coast is mostly inhabited by Monsters there have been sightings of strange angel-looking creatures, we should explore the interior of this continent."
#Branch 2
FAR_preparation_title: "Rally the Fallen Angels"
FAR_preparation_desc: "Our young realm has no standing army, we need to quickly establish one from our strongest fallen angels if we are to break free from Micaela's rule."
FAR_trade_title: "Along the Coast"
FAR_trade_desc: "The Lemuse coast area is very rich in trade, asserting ourselves here with open new trade routes for our goods."
FAR_happiness_title: "To Happiness Village"
FAR_happiness_desc: "Happiness village is famous for its production of Happiness honey. As all angels love sweet things, we are naturally attracted to this location."
FAR_midas_title: "Midas Gold Mines"
FAR_midas_desc: "The goldmines of Midas village represent an invaluable target for our nation, with such material at our disposal we could produce high quality gold equipment and accessories! We could look more angelic than Eden herself!"
#Branch 3
FAR_defense_title: "Recruit the Angels"
FAR_defense_desc: "We are short on manpower for our struggle for freedom, we need to fill our ranks with the angels by enticing them with promises to search for answers on the fate of Heaven and the Goddess of Light."
FAR_freedom_title: "Freedom!"
FAR_freedom_desc: "Thanks to our blood and sweat we were successful in asserting ourselves as an independent entity in this world, now our journey begins!"
FAR_enrika_unification_title: "To the Outside World!"
FAR_enrika_unification_desc: "All of the Lost Woods are under our rule, we are now free to expand into the outside world for the first time!"
FAR_continental_ilias_title: "Fallen Seraphs"
FAR_continental_ilias_desc: "All of the continent bearing the name of Ilias is ours! Today the morning star rises above the sun!"
#Branch 4
FAR_allies_title: "Search for Allies"
FAR_allies_desc: "The quicker the war is over the quicker we can focus on building our new state up. Finding other realms willing to support our endeavor should increase our chances of success and reduce devastation in our lands."
FAR_forest_title: "Across the Forest"
FAR_forest_desc: "The Lost Woods are immense, we need to traverse all of it if we want to see the world!"
FAR_slime_title: "Visit Iliasville"
FAR_slime_desc: "Our first stop in our journey through the world is the nearby village of Iliasville and its surroundings. Although nothing special this nevertheless remains a great step forward for our country and will allow Fallen Angel merchants to trade our goods far and wide."
FAR_pornof_title: "Adventure into Pornof"
FAR_pornof_desc: "The village of Pornof has an infamous reputation among the Ilian population... But that just increases our curiosity even more!"
#Branch 5
FAR_farm_title: "A Purpose In Life"
FAR_farm_desc: "Not long ago we would have prefered death over being covered in dirt from farmwork or being in contact with earth's animals, but now we feel like we have a purpose in life. This realization helped us persevere through tough times and will undoubtedly aid us in moving forward."
FAR_enrika_title: "Takeover of Enrika"
FAR_enrika_desc: "We have annexed Enrika Village in its entirety and  are now in charge of its administration. Although Micaela isn't pleased by our rebellion she nevertheless understands our reasons and more importantly acknowledges our military triumph over her. Despite everything she's willing to offer her guindance to our young court for a while."
FAR_angel_estate_title: "Woo the Angels"
FAR_angel_estate_desc: "Not all of the angels in our realm were cast down on earth from Heaven, some are just regular angels that  happened to be on a scouting mission during the Great Disaster. Many of these angels are still worried over the fate of Heaven and its residents, we have promised them that we will also seek to expand closer to Heaven and investigate what happened there."
FAR_monster_estate_title: "Elves in the Army"
FAR_monster_estate_desc: "We have lived alongside the Elves for a very long time, and with their prowess in combat it is only natural that we integrate them in our military apparatus for the betterment of our army."
FAR_lime_title: "Covenant with the Slimes"
FAR_lime_desc: "We have establish very good relations with the slime girls near Iliasville, and they have proven to be very good merchants, perhaps we should consider fully integranting them in our society."
FAR_plants_title: "Alraune Expertise"
FAR_plants_desc: "Plant monsters are extremely good at farming, for hard working angels such as ourselves their knowledge and skills are very valuable. Let us bring them into the fields to teach our farmers."
