l_english:
#Branch 1

RMA_rostrum_1_title: "Revive Rostrum"
RMA_rostrum_1_desc: "As ghost-types that can communicate with the dead we are in a perfect position to rebuild the ruined village of Rostrum by bringing its former villagers back as ghosts."

RMA_rostrum_2_title: "Restore Pornof Trade"
RMA_rostrum_2_desc: "Our reconstrution efforts are slowly paying off, but right now Rostrum is just a ghost town... in every sense of the word. If we are to turn this village into something else we need the manpower of the living, but the village offers little accomodation for anyone but spirits right now. We must first build the infrastructure to house flesh. The first step is to connect the village with the trading arteries of the rest of the world. In the past Pornof used to be the main trade partner of Rostrum, as such we will restore that link first."

RMA_rostrum_3_title: "Begin Candle Production"
RMA_rostrum_3_desc: "Rostrum Village was never a particulary noteworthy village, with its greatest claim to fame being the home of a great chef. Now as we are reshaping it from the ground up to accomodate new living residents, we have the opportunity to begin a new tradition for the village: the production of candles. As we candle girls are ghosts possessing candles akin to Tsukumogami that can't reproduce on their own, it would be in our best interest to mass produce candles to increase the chances of new candle girls being born in the future. We must build up the infrastructure for the production of pink dye to allow this."

RMA_rostrum_4_title: "Purify the Waters"
RMA_rostrum_4_desc: "The waters in and around Rostrum Village are contaminated and unfit for consuption, all living things need clean water to survive as such we need to purify the waters before thinking about bringing in new residents, high level slimes should be capable of carrying out the purification we need."

RMA_rostrum_5_title: "Attract Human Immigrants"
RMA_rostrum_5_desc: "We need humans to sustain ourselves and now that infrastructure and clean water are present we can begin our efforts to attract human immigrants to the village, we should lower our taxes in the region to incentivized them to move here." 

RMA_rostrum_6_title: "Shining Rostrum"
RMA_rostrum_6_desc: "Rostrum has been completely changed from what it used to be, surpassing even its glory days the village has now become a fully fledge city, a melting point of many different people and center of trade. With the wax industry we constructed here and the many humans now inhabiting it our problems with reproduction are a worry of the past."

#Branch 2

RMA_meda_title: "Claim all the caves"
RMA_meda_desc: "The meda monsters inhabiting the caves to our east present a vulnerability in our flank, we must take their caves by force to remedy this."

RMA_slime_title: "Learn from the Slimes"
RMA_slime_desc: "Although we are ghost types our bodies are made out of wax and are very similar to the bodies of slimes but with less water, regardless the slimes are able to mold their bodies to their liking and some can even harden or soften their skin at will...such an skill might come in handy with our weakness to fire, we must learn from them how to manipulate our slime body."

RMA_worm_title: "Through Irina"
RMA_worm_desc: "We are facing many slimy foes, between the slimes, the earthworms and the slugs, but we can't falter now, past their kingdoms lies the Lost Woods and the Mithra catle within Irina mountains, both locations are in need of some flames."

RMA_enrika_title: "Burn Down the Forest"
RMA_enrika_desc: "We have establish ourselves in the Lost Woods, finding a lot of resistance from the locals has slowed our conquest down, but if we unleash the power of our flames things should be much easier, especially considering the enviroment we're in."

#Branch 3

RMA_keep_flame_title: "Keep the Flame Burning"
RMA_keep_flame_desc: "We candle girls are cave dwellers, but restricting ourselves to only the caves of Rostrum Mountains will make us easy prey for expanding nations, we need to expand first."

RMA_invade_rostrum_title: "Invade Rostrum"
RMA_invade_rostrum_desc: "Outside of home lies the former village of Rostrum, now fallen to ruin and overrun by the vile ropers. As barren as this place is, it's the nearest path of expansion we have outside our caves."

RMA_nationality_title: "Outward Expansion"
RMA_nationality_desc: "We have asserted ourselves in the Rostrum region, with no more foes in our way here there's only one way forward: towards Pornof Village."

RMA_orc_title: "Subjugate the Orcs"
RMA_orc_desc: "Just outside our home lies the realm of the orc girls, who are raiding every hamlet they come across. We must squash them to protect our realm and further expand our influence."

RMA_sheep_title: "Tackle the Sheeps"
RMA_sheep_desc: "Iliasburg is the largest and wealthiest city on the continent making it a juicy target for us, but between us and them stand the drunken sheep girls. Alas we ought to finish what their livers have started!"

RMA_iliasburg_title: "Iliasburg Fading"
RMA_iliasburg_desc: "Iliasburg's walls have fallen to our fire magic, setting the stage of our dominance over the continent!"

RMA_eternal_flame_title: "Eternal Flame"
RMA_eternal_flame_desc: "Despite the frailty of our bodies we have persevered through all the hardships this world has thrown at us, everyone who calls the continent of Ilias home is now our subject or a smoking pile of ash. Although we have bled, our flames have rekindled stronger than ever, our light shall never be extinguished!"

#Branch 4

RMA_tartarus_title: "Pillage Tartarus"
RMA_tartarus_desc: "Near Rostrum Village lies the Eastern Ilias Tartarus that formed during the great disaster 30 year ago. The rumours we heard from the humans suggest the inside of Tartarus is filled with advanced technology. That is already plenty of reason to annex the region. However we cannot but wonder if the presence of Tartarus is be connected to the downfall of Rostrum..."

RMA_harpy_title: "Harpy Village Takeover"
RMA_harpy_desc: "Harpy Village represents an important trading center in the continent, but further away, the gold of Midas Village has caught our attention, we must make our way there to secure our income."

RMA_gold_title: "Midas Gold"
RMA_gold_desc: "We are within reach of the Midas gold mines, if we can claim them we will never have to worry about finances ever again!"

#Branch 5

RMA_ghost_army_1_title: "Candle Girl Expansion"
RMA_ghost_army_1_desc: "Our realm is quite small compared to most Ilian nations, we must expand our borders if we are to stand a chance in this world."

RMA_ghost_army_2_title: "Burning Memory"
RMA_ghost_army_2_desc: "Candle Girls can't reproduce and our way of coming to be requires a lot of time, perhaps it would be a sound choice if we invest our magical and spiritual power into raising undead soldiers to fill the ranks in our army."

RMA_ghost_army_3_title: "Strengthen The Spiritualists"
RMA_ghost_army_3_desc: "The newly established faction of the spiritualists tasked with raising zombies and channeling spirits has already greatly bolstered our standing army. We should seek to cooperate with them and integrate them into our administration for further gains."

RMA_ghost_army_4_title: "Legion Of The Dead"
RMA_ghost_army_4_desc: "The influence of the spiritualists has proven to be of immense help, we have raised an entire army of zombies marching under our banner. Also the spirit channeling practices we have developed allow us to bring forth new candle girls faster by inviting the ghosts of the past to take physical form by posessing the candles we produced."

