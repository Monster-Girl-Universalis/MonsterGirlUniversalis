l_english:
#Branch 1
hr1_ilias1_title: "Search for Answers"
hr1_ilias1_desc: "Heriel wonders how Goddess Ilias is doing. She hasn't seen her for so many years. Heriel believes there's a chance of finding the Goddess within the deepest part of Ilias Temple."
hr1_ilias2_title: "Ilias' Plight"
hr1_ilias2_desc: "When Ilias herself appeared before Heriel in the deepest part of the temple consumed by chaos, it all became clear. The same space distortion that changed Heriel is at fault for the state of the temple and her goddess. Ilias seems to have been incapacitated by this distortion while a mere low ranking angel such as Heriel was completely overwhelmed. Recognizing Heriel's newfound power, Goddess Ilias commands the confused angel to secure the temple by any means necessary."
hr1_ilias3_title: "Battle for Heaven"
hr1_ilias3_desc: "Heriel returns triumphantly to Ilias, having secured the whole of the temple. Impressed by such an achievement, the goddess proceeds to explain that a magical barrier was erected around the Ilias Temple to prevent chaos from spreading to the outside world. The creator of this barrier is Seraph Eden, and she's currently using her power to maintain it. However, it seems that after so many years she's running out of power and the barrier has been weakening. Ilias then orders Heriel to use her power to break through the barrier, bring the angels of Heaven under her control, and find and bring Seraph Eden here."
hr1_ilias4_title: "Rise of Heriel"
hr1_ilias4_desc: "As most of Snow Heaven has fallen to the armies led by Heriel, an angry Eden, mistaking Heriel for an agent of chaos, confronts her in battle. The fight, however, reaches a stalemate as Eden's power has been slowly siphoned by the barrier. The apoptosis angel then explains to the seraph who she is and the commands she received from the Goddess of Light, and asks her to follow her to the ruins of the Ilias Temple. Once Eden is reunited with Ilias, the goddess lays out a plan to her subjects: Eden will remain by Ilias' side, maintaining the barrier with the goddess' added magical power, while Heriel will take over the angel armies and expand the dwindling true faith in the world."
hr1_church_title: "Churches for Ilias"
hr1_church_desc: "The worship of Ilias has been on the decline ever since the great disaster. We should remedy this first and foremost within our domain. Communities have grown and prospered around churches in the past and we must follow that example as well."
hr1_dev_heriel_title: "Growth of Heriel's Lands"
hr1_dev_heriel_desc: "Heriel's core lands aren't as developed as the rest of Snow Heaven. Having a magnificent capital surrounded by underdeveloped lands isn't a good message for our followers and subjects, so we should concentrate our efforts on the growth of our initial states."
hr1_new_heaven_title: "Heaven on Earth"
hr1_new_heaven_desc: "For the foreseeable future, Heaven will remain a part of this world. As such, we must bring all of it to the rest of the world's level and beyond, for this is our home and holy Heaven!"
#Branch 2
hr1_alciel_iriasu_title: "Power of Chaos"
hr1_alciel_iriasu_desc: "Heriel's holy power has mixed with something else, and this has granted her immense power. But it seems she wasn't the only angel to suffer this fate, as she can sense a similar power coming from Alciel. Perhaps it's time Heriel tests out her new body against an evenly matched foe."
hr1_sea_title: "Beyond the Sea"
hr1_sea_desc: "Outside the Snow Continent, the followers of Ilias have been decreasing in number ever since the goddess stopped appearing. As Heaven's new vanguard, it is our duty to spread Ilias' teachings."
hr1_saloon_title: "Saloon Beachhead"
hr1_saloon_desc: "Heriel's army has successfully established our presence on the scorched lands of Saloon. While this part of the world isn't particularly infested with monsters, it is what lies east of Saloon that is of interest: the Safina Tartarus and a mysterious tower that seems to have appeared out of nowhere recently."
hr1_great_projects_title: "Murky Mysteries"
hr1_great_projects_desc: "We've secured both the Tartarus rift and the enigmatic tower to its east. While the tower is partially accessible, it seems we can no longer reach whatever knowledge was kept inside. Still, we must investigate."
#Branch 3
hr1_chimera2_title: "Chimeric Angels"
hr1_chimera2_desc: "Within the Ilias Temple Ruins, many strange monsters known as chimeras roam about. One of note is a species that seems to hold angel genes. The mutated state of chimeras may prove useful in the future."
hr1_angel_title: "Angelic Powers"
hr1_angel_desc: "Heriel may have fallen victim to a drastic change, but so has every other angel living in Snow Heaven, and they have endured all these years. Indeed, we must not forget our angelic heritage and our loyalty to Ilias, no matter what."
hr1_angel_apoptosis_title: "Angel Apoptosis"
hr1_angel_apoptosis_desc: "The combination of apoptosis and angel genes within Heriel's body has created a unique being with great power. Heriel has mastered the full potential of her new body's genes, and now it is time to bring about the will of Goddess Ilias."
hr1_razing_razing_like_its_remina_title: "Sword of Ilias"
hr1_razing_razing_like_its_remina_desc: "Everywhere Heriel looks, there are heretics and enemies of the goddess crawling about, both monsters and humans alike. It is only a matter of time, however, as Heriel's blazing fire shall purge this world of all the Goddess' foes, burning everything to ashes."
hr1_heriel_hegemon_title: "Angel Superpower"
hr1_heriel_hegemon_desc: "Heriel's empire has reached heights no other nation could. The whole world trembles at the sound of her name, our armies feared by all great powers. Now everything is within reach and the plans of the Goddess shall bear fruit."
#Branch 4
hr1_dev_eliciel_title: "Develop Eliciel's power"
hr1_dev_eliciel_desc: "Eliciel is an angel imbued with plant energy, allowing dominion over them. Such a fertilizing power will be most useful for developing the new snowy landscape of our home."
hr1_apoptosis_title: "Apoptosis Metamorphosis"
hr1_apoptosis_desc: "During the Great Disaster, Heaven was struck down from the skies, and in its aftermath Heriel found herself changed into a being partially made of chaos. But not all was lost, for her sanity was retained. Thus, this wretched power can be controlled."
hr1_dev_uranus_title: "The Holy Beast"
hr1_dev_uranus_desc: "Uranus is a beast angel with a strong body suited for close combat, her might serving as protection for believers and doom for sinners. Such strength must be nurtured in all of us."
#Branch 5
hr1_early_conquest_title: "Heriel's Quest"
hr1_early_conquest_desc: "Heriel's memories are hazy, her body feels different, and she can't find the other angels nor Ilias. all the while strange monsters she's never seen trek about the goddess' sacred temple. At least now she has one set goal in her mind, find Ilias."
hr1_chimera1_title: "Taming the Beasts"
hr1_chimera1_desc: "Heriel doesn't understand what has happened to Heaven, but all around her are monsters polluting her home. The goddess would smite them down without hesitation, and so shall Heriel."
hr1_witch1_title: "Burn the Witches"
hr1_witch1_desc: "The ice witches and the beastly polar bear girls are making a mockery of Ilias. Let's see how they fare against Omega Blaze!"
hr1_east_angels_title: "Unify the Angels"
hr1_east_angels_desc: "As per order of the goddess, Heriel is to bring under her control all of the continent that makes up Heaven. This unfortunately includes other angels, but we will be stronger under a single banner than on our own."
hr1_gold_apoptosis_title: "Hunting Apoptosis"
hr1_gold_apoptosis_desc: "Next to our continent lies the Gold region. On its western shores a Tartarus rift can be found, from which the apoptosis could plague the entire continent should they build a base of power there. The secrets of Gold Tartarus must be ours, and the apoptosis shall bow to Heriel."
hr1_gold_hellgondo_title: "At the Gates of Hell"
hr1_gold_hellgondo_desc: "We have secured the westernmost part of the Gold continent, setting the stage for an invasion of Hellgondo, home of the wicked Monster Lord. We have also integrated the mechanical roid apoptosis into our military ranks. This will surely smooth our eventual confrontation with the Monster Lord."
hr1_colonial_islands_title: "Colonial Endeavors"
hr1_colonial_islands_desc: "Our sailors report sightings of uncharted islands near us. This might be our chance at acquiring colonial holdings, although it will most likely prove to be expensive..."
