#Government Reform
roid_reform: "Roid Militarization"
roid_reform_desc: "Roids with their mechanical bodies and prowess in using makina are living war machines, by empowering them and modelling our military after them we ensure our armies will lay waste to any enemy that stands in our way."
#Events
flavor_cr3.1_title: "Our Crab Roots"
flavor_cr3.1_desc: "We have reached the shores of Soapy's realm inhabited by the crab girls, as former crabs ourselves we have found a lot of common ground with them, indeed their puns seem to be improving our mood and social skills...spending more time with them will better our understanding of bonds and help us reconnect with our crab nature."
flavor_cr3.2_title: "Request From Saki-Chan"
flavor_cr3.2_desc: "The succubus idol Saki-chan from the faraway Grandeur has come to our court to request help. She wishes to learn the dance of the sea dwellers, as the ones who currently rule over the regions of interest and we share a bond with the crab girls. We are in a position to indulge the idol's request to strengthen our own biology further, we shall bring with us the seaweed girls into the home of Kraken."
flavor_cr3.3_title: "Human Curiosity"
flavor_cr3.3_desc: "Many humans have become our subjects, to our suprised they proved to be hard working researches with a bottomless curiosity for the world just as us. The path of truth will be that much easier with them at our side."
#Event Choices
flavor_cr3.1.a: "Mechrabical...That's a new one."
flavor_cr3.2.a: "Hm...the sea genes appear to be taking root in me..."
flavor_cr3.3.a: "Let us elevate their status to match our own, we are equals!"


