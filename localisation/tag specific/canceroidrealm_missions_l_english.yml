l_english:
#Branch 1
CR3_institution_title: "Research Efforts"
CR3_institution_desc: "We have recently expanded outside the limits of the laboratory and most of the outside world is unknown to us, but we must quickly adapt to this new reality and bring our knowledge to the same level as our neighbours."
CR3_lab_title: "Lab Upgrade"
CR3_lab_desc: "We've brought all of the laboratory under our control, gaining access to all of its information and makina, with our newly found connection to the outside world we must make preparations to upgrade and fix the equipment of the lab so that it can continue to function in autonomy."
CR3_reform_title: "Roid State Reform"
CR3_reform_desc: "Our nation's government has existed for quite a while now, changing drastically during this time. After so much changes we've come to realized that change is a constant of this universe, and thus our government must always be flexible and ready to change course to adapt."
#Branch 2
CR3_money_makina_title: "Black Makina Trade"
CR3_money_makina_desc: "We need money to support our ambition of independence, luckily for us, the laboratory is full of makina and other valuable tech from the future, such a surplus will help both equip our armies and make a quick buck by selling makinas to the outside world."
CR3_lab_dwellers_title: "Lab Dwellers"
CR3_lab_dwellers_desc: "The Laboratory isn't home to just us Canceroids, we should focus on integrating them into our society as to avoid any problems."
CR3_development_title: "Administration Core"
CR3_development_desc: "Our growing country needs a more efficent center of administration to not fall into decadence, we must concentrate all of our administrate capabilities into our capital state from which we shall rule all of our provinces."
CR3_natalia_title: "Natalian Conquest"
CR3_natalia_desc: "Port Natalia is a rich and powerful country in the eastern part of our continent, our gatling guns should make cannon fodder our of their armies, and once we've establish ourselves here, our estern flank will be secured."
CR3_second_golden_age_title: "Seaway Into The World"
CR3_second_golden_age_desc: "All of Port Natalia is ours, along with its strategic sea access, this will allow us to expand our control of several neighbouring trade nodes and open future paths of expansion should we wish to walk that path."
#Branch 3
CR3_prepare_for_war_title: "Secure The Lab"
CR3_prepare_for_war_desc: "As mechanical being we rely on the spare parts we find within the laboratory to maintain ourselves, but this status quo is frail at best, we could restructure the lab to become a facility dedicated to makina research and production for our needs but in order to do that we must secure everything inside the laboratory and its immediate surroundings."
CR3_luddite_title: "End Luddite Rule"
CR3_luddite_desc: "Just outside the laboratory we have discovered Luddite village, a underdeveloped human village that rejects makina technology and oppresses its inhabitants with its reactionary midset. We can't tolerate such a backwards society right in front of our eyes, this calls for some updates to the village!"
CR3_kani_title: "Crab Ties"
CR3_kani_desc: "The crab realm ruled by Soapy represents a zone of vital streategic interest for us, not only for it would grants us access to the sea, but its inhabitans themselves the crab girls share roots with us Canceroids. Integrating them as equals in our nation shouldn't therefore be too problmatic and it we might learn some lessons from our fleshy cousins..."
CR3_san_ilia_title: "Break The Papal Yoke"
CR3_san_ilia_desc: "San Ilia is the strongest power in our vicinity and so long as they exist our autonomy will always be in danger, it is time we take our the armies of the pope and secure our future once and for all!"
CR3_chrome_title: "The Necromancer"
CR3_chrome_desc: "Our expansion westwards has put our nation on the doorstep of the realm ruled by the necromancer Chrome D'artiste, although a fellow seeker of truth we must prioritized the growth of our state so that we may continue our research. War will decide which nation will lead the seeker of truth into tomorrow..."
CR3_puppet_tower_title: "Doll Empire"
CR3_puppet_tower_desc: "Protected by mountains on all sides but one, puppeteer tower's mere geography grants it great power status, the doll empire must be bought down to its needs least they become the largest power on the continent."
CR3_natalia_continent_title: "Roid Supremacy"
CR3_natalia_continent_desc: "Our armies have conquered everything from the tip of port natalia to the borders of the scorching sands of Sabasa, we have become an unconquerable power, our roid army will dictate history from now on!"
#Branch 4
CR3_support_title: "Roid Militarism"
CR3_support_desc: "Our mechanical bodies are armed to the teeth with makina, in such an enviroment we are compelled into focusing our efforts into the militarization of our state, with the goal of producing ever improving roid unit better fit for combat."
CR3_warpath_title: "Warpath"
CR3_warpath_desc: "Although the quality of our forces and makina means we can achieve victory against a much larger opponent, we need to bolster the size of our armies to reduce the chances of losses and to increase the damage inflicted upon our foes."
CR3_blobbing_title: "Herald Of War"
CR3_blobbing_desc: "The quality of our army has reached such peaks that it has gained notoriety throughout the world has one of the most deadly forces, we must make use of this reputation to embolden our militarism!"
CR3_roid_ideas_title: "Final Evolution"
CR3_roid_ideas_desc: "The militarization of our society has yield many results, changing the very nature of our culture and our traditions in the process. Now we are a nation dedicated to warfare never to be caught off guard by the fires of war, if war is hell then we are its herald!"
CR3_professionalism_title: "Army With A State"
CR3_professionalism_desc: "Although the vast majority of experience is gained wtih active warfare, there are times when waging war might not be in our best interest, as such we must organize our forces to always drill and prepare for war during peace time. Doing so will not only increase our readiness for conflicts, but also turned our armed forces into a fith "estate" always loyal to us, and always ready to enforce our will outside and within our country.
#Branch 5
CR3_scientific_method_title: "Scientific Method"
CR3_scientific_method_desc: "The regions to our south and east are inhabited by many uneducated monsters and humans, these people are likely to become citizens of our country when our army inevitably marches on their lands, we must prepare our internal education system to bring progress to such people for the future."
CR3_scientific_method_2_title: "Progress For All"
CR3_scientific_method_2_desc: "Our rapid expansion has put strain on our education system, but knowledge is the right of all sentient beings, we mustbring its light to all who reside within our borders!"
CR3_scientific_method_3_title: "Education Reform"
CR3_scientific_method_3_desc: "we have learned much from the difficulties we've face thus far with the education of our people, we are ready to reform our system so that it will keep up with our expansion."
