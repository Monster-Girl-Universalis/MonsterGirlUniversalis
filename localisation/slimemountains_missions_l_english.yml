#Goverment Reform
slime_republic: "Slime Republic"
slime_republic_desc: "A free republic ruled by jiggly slime girls dedicated mainly to the trade of boomerangs, fish, fish boomerangs and anything that catches their eye."
#Events
flavor_slm.1_title: "Birth of the Slime Republic"
flavor_slm.1_desc: "We have form a new republic where the voice of every slime can be heard, even the weaker ones! The first vote our citizen will have to cast will be a simple one for starters; To rebrand our country to reflect our new democratic values or not! Be sure to vote everyone puru puru!"
#Event Choices
flavor_slm.1.a: "The new name wins!"
flavor_slm.1.b: "The old name stays! What a bummer puru..."
