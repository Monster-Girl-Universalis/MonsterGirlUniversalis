#Events
flavor_slugs.1_title: "A Damp Paradise"
flavor_slugs.1_desc: "Warp Shrine sits at the north edge of the continent, serving as a connection to the north Ilias monastery on the island of the famous Medal queen. But that isn't of noticed for us damp-lover land dwellers, the area around the shrine is swampy and just the right damp for us, now that this area is under our control many of our citizens are immigrating here, the province's numbers are sure to rise even higher with such a perfect enviroment..."
flavor_slugs.2_title: "Midas Village Conquered!"
flavor_slugs.2_desc: "The whole of Midas village, alongside its gold mines are now under slug control, now what's left to do is decide what to do with the human inhabited parts of the village, the wretched humans who called us pests..."
#Event Choices
flavor_slugs.1.a: "Wet and damp..."
flavor_slugs.2.a: "We'll take control of all institutions of this village from them!"
flavor_slugs.2.b: "We must be the better monster and show benevolence."
