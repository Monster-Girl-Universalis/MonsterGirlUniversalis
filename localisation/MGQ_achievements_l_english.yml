l_english:
 ###ACHIEVEMENT EVENTS###
 MGQ_achievements.1.t: "Achievement unlocked! - Slug Deinfestation"
 MGQ_achievements.1.desc: "Start as Midas Village and conquer all the starting Slug nations in Midas and Ilaisburg regions by 1474."
 MGQ_achievements.1.a: "No more pests in our village."
 MGQ_achievements.2.t: "Achievement unlocked! - It's Shrimple"
 MGQ_achievements.2.desc: "Start as Sully Apoptosis and conquer the entire Ilias Continent."
 MGQ_achievements.2.a: "Hey! Hey! I wanna go outside!"
 MGQ_achievements.3.t: "Achievement unlocked! - She is a Genius!"
 MGQ_achievements.3.desc: "Start as Chrome and reach 100 innovativeness."
 MGQ_achievements.3.a: "Mwah-ha-ha! Behold the great Chrome Artiste!"
 MGQ_achievements.4.t: "Achievement unlocked! - Fundamentalist Takeover"
 MGQ_achievements.4.desc: "Start as Luddite Village and form San Ilia."
 MGQ_achievements.4.a: "The End is near! We must follow the Goddess!"
 MGQ_achievements.5.t: "Achievement unlocked! - Sandstorm"
 MGQ_achievements.5.desc: "Be Sabasa and have at least +50% Shock Damage, +50% Cavalry Combat Ability and 200 cavalry regiments."
 MGQ_achievements.5.a: "Let's rush to battle!"
 MGQ_achievements.6.t: "Achievement unlocked! - New Pirate Queen"
 MGQ_achievements.6.desc: "Start as Fishy Pirates and become a Mermaid Queen."
 MGQ_achievements.6.a: "Ashel would be proud..."
 MGQ_achievements.7.t: "Achievement unlocked! - I love Fluffy Tails"
 MGQ_achievements.7.desc: "Complete Tamamo's mission tree."
 MGQ_achievements.7.a: "Touch them as much as you want~"
 MGQ_achievements.8.t: "Achievement unlocked! - Cow Demon's Conquest"
 MGQ_achievements.8.desc: "Start as Cow Demon Queen and conquer 200 provinces before the age of Monster Lord Wars."
 MGQ_achievements.8.a: "I will become the Beast Queen like my ancestor!"
 MGQ_achievements.9.t: "Achievement unlocked! - A New Power in Plansect"
 MGQ_achievements.9.desc: "Start as any subject of Plansect Village or Red Mountain and unite the Plansect Region."
 MGQ_achievements.9.a: "I.. unified Plansect? I hope we can have peace now."
 MGQ_achievements.10.t: "Achievement unlocked! - Monster Lord Cassandra"
 MGQ_achievements.10.desc: "Start as Lady Village and conquer the Monster Lord capital before the age of Monster Lord Wars."
 MGQ_achievements.10.a: "My lifelong ambition. At last."
 MGQ_achievements.11.t: "Achievement unlocked! - I believe in Potato Supremacy"
 MGQ_achievements.11.desc: "Start as Succubus Village, Succubus Hideout or Queen Eva, have trading in grain bonus and have 50 farm estates."
 MGQ_achievements.11.a: "Succubus Village is in good hands."
 MGQ_achievements.12.t: "Achievement unlocked! - Great Monster Lord"
 MGQ_achievements.12.desc: "Complete the Monster Lord mission tree."
 MGQ_achievements.12.a: "Glory to the strongest Monster Lord!"
 MGQ_achievements.13.t: "Achievement unlocked! - Goddess Ilias Re-Creation Plan"
 MGQ_achievements.13.desc: "Start as Goddess Ilias and conquer the entire Singularity World."
 MGQ_achievements.13.a: "Ha-ha-ha! This is what I call the right side of history!!!"
 MGQ_achievements.14.t: "Achievement unlocked! - Race Collector"
 MGQ_achievements.14.desc: "Complete 10 racial ideas and have at least 15 races as integrated."
 MGQ_achievements.14.a: "That's a lot of races."
 MGQ_achievements.15.t: "Achievement unlocked! - I became the ultimate existance"
 MGQ_achievements.15.desc: "Integrate every possible race."
 MGQ_achievements.15.a: "I am Alpha and Omega."
 MGQ_achievements.16.t: "Achievement unlocked! - Leech Girl"
 MGQ_achievements.16.desc: "Start as Leech Girl Realm and have the highest income in the universe."
 MGQ_achievements.16.a: "Woah, I'm rich!"
 MGQ_achievements.17.t: "Achievement unlocked! - Rekindle the Flame"
 MGQ_achievements.17.desc: "Restore the lost kingdom of Remina."
 MGQ_achievements.17.a: "Remina is finally back."
 MGQ_achievements.18.t: "Achievement unlocked! - Remina Restoration"
 MGQ_achievements.18.desc: "Start as Iliasville and form the lost kingdom of Remina."
 MGQ_achievements.18.a: "A lost branch of Remina’s royal family has returned."
 MGQ_achievements.19.t: "Achievement unlocked! - Moonlight Invasion"
 MGQ_achievements.19.desc: "Be a Vampire Queen and conquer the entire Gold or Hellgondo continent before the age of Decision."
 MGQ_achievements.19.a: "What is a man? A miserable little pile of secrets."
 MGQ_achievements.20.t: "Achievement unlocked! - Slug Swarm"
 MGQ_achievements.20.desc: "As any nation with slug girl primary culture, have 3 vassals with slug girl primary culture with at least 300 development each."
 MGQ_achievements.20.a: "Sticky and slimy."
 MGQ_achievements.21.t: "Achievement unlocked! - Pyrophytes"
 MGQ_achievements.21.desc: "Be an Alraune or Alraune Apoptosis nation, grow by 1000 development, follow Fire Spirit religion and have at least +30% Fire Damage."
 MGQ_achievements.21.a: "Fire isn't scary."
 MGQ_achievements.22.t: "Achievement unlocked! - Hold my Chaos Stew"
 MGQ_achievements.22.desc: "Start as any Hellgondo Apoptosis nation and win the war against Monster Lord or Saja by 1474."
 MGQ_achievements.22.a: "You love paradox difficulty, don't you?"
 MGQ_achievements.23.t: "Achievement unlocked! - Hedonistic Flower"
 MGQ_achievements.23.desc: "Start as Kanon Domain and have the highest income in universe as well as maximum Kanon satisfaction."
 MGQ_achievements.23.a: "I'm satisfied, fu-fu-fu..."
 MGQ_achievements.24.t: "Achievement unlocked! - Kanade Wall"
 MGQ_achievements.24.desc: "Start as Kanade Domain and have a general with 10 maneuver as well as +100% manpower recovery speed and +100% defensiveness."
 MGQ_achievements.24.a: "My kin is secure."
 MGQ_achievements.25.t: "Achievement unlocked! - Cyber Yamatai"
 MGQ_achievements.25.desc: "Start as Tamamo no Mae Domain and reach 100 innovativeness while having completed kitsune and roid ideas."
 MGQ_achievements.25.a: "I will lead Yamatai to a new era."
 MGQ_achievements.26.t: "Achievement unlocked! - Eva's Discipline"
 MGQ_achievements.26.desc: "Start as Minagi Domain and control Queen Eva's capital while her nation doesn't exist."
 MGQ_achievements.26.a: "Why... Why me? Why it always happens to me?..."
 MGQ_achievements.27.t: "Achievement unlocked! - Tasty Tasty Food!"
 MGQ_achievements.27.desc: "Start as Hiruko Domain and have trading bonuses for grain, fish, livestock, wine, spices, cocoa, sugar, cloves, ivory, copper and iron!"
 MGQ_achievements.27.a: "Ahahaha! It's all-you-can-eat buffet!"
 MGQ_achievements.28.t: "Achievement unlocked! - Nation of 'Balance'"
 MGQ_achievements.28.desc: "Start as Saja Domain and become a hegemon with 100 strength before the age of Decision."
 MGQ_achievements.28.a: "As a leader of the Six Ancestors, I will fulfill mother's plans."
 MGQ_achievements.29.t: "Achievement unlocked! - Ilias Kreuz Liberation Army"
 MGQ_achievements.29.desc: "Start as Makai Goldport, defeat Kanon and fully control Grangold and Goldport regions."
 MGQ_achievements.29.a: "Ilias Kreuz onward! We will liberate our comrades."
 MGQ_achievements.30.t: "Achievement unlocked! - Eden Strikes back"
 MGQ_achievements.30.desc: "Start as Eden Resistance, become a great power of at least rank 3 and have Hiruko Domain removed from the map."
 MGQ_achievements.30.a: "This is the first time since the Great Monster War... Now we have a chance."
 MGQ_achievements.31.t: "Achievement unlocked! - Yarr harr, fiddle-dee-dee!"
 MGQ_achievements.31.desc: "Start as Fishy Pirates, Gloria Pirates or Roza Pirates, have 200 ships privateering and +100% privateer efficiency."
 MGQ_achievements.31.a: "Pirate life is for me!"
 MGQ_achievements.32.t: "Achievement unlocked! - Fall of the Ancestor"
 MGQ_achievements.32.desc: "Be a nation with human culture and form Makai San Ilia, Sabasa, Grand Noah or Grangold."
 MGQ_achievements.32.a: "We really did it this time."
 MGQ_achievements.33.t: "Achievement unlocked! - Messenger of the Goddess"
 MGQ_achievements.33.desc: "Start as Heavenly Gate and own the entire Singularity Noah while having it converted to Angel World religion."
 MGQ_achievements.33.a: "Glory to Lady Ilias."



