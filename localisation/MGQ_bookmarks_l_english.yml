 MGQ_MAKAI: "Makai"
 MGQ_MAKAI_DESC: "The world where the Dark Goddess achieved a decisive victory over Goddess Ilias and struck her down. Divided among the Six Great Ancestors, its living standards vary greatly. In this world where power is everything, the fate of the people depends entirely on the character of their Ancestor or local Queen - whether they rule with cruelty or with benevolence.\nThe Dark Goddess herself takes little interest in mortal affairs and even rejects the title of goddess, calling herself instead the Incarnation of Darkness. She is the most powerful being in this world, yet by no means omniscient or omnipotent, choosing to seclude herself within her chambers.\nBut now, faced with the impending crisis of the world’s destruction, she has devised a plan for worlds unification: the transfer of souls from other worlds, brought forth through their death. Will you truly side with such a being, oh brave player?"
